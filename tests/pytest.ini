# Lives in tests/ rather than the repo root on purpose.
#
# Hermes requires an __init__.py at the plugin root, which makes pytest treat
# the root as a package and try to import that file standalone as a module
# named "__init__". That cannot work: it is the entry point of a relative-import
# package, not an importable module. Keeping the ini here pins rootdir to tests/
# so collection never walks up into the package root.
[pytest]
testpaths = .
